name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: AppleSilicon }
          - { os: macos-15-intel, label: Intel }
          - { os: windows-2022, label: win }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - run: pyinstaller --noconfirm --distpath ../dist --workpath ../build reforge.spec
        working-directory: packaging
      - name: DMG (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: packaging/macos/make_dmg.sh ${{ matrix.label }}
      - name: Setup EXE (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
        shell: pwsh
      - uses: actions/upload-artifact@v5
        with:
          name: reforge-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*Setup.exe
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          files: out/*
          body: "Private pre-release. Unsigned unless signing secrets are configured. See CHANGELOG.md."
