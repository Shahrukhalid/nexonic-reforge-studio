name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.1)"
        required: false

permissions: { contents: write }

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: AppleSilicon }
          - { os: macos-15-intel, label: Intel }
          - { os: windows-2022, label: win }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - run: pyinstaller --noconfirm --distpath ../dist --workpath ../build reforge.spec
        working-directory: packaging
      - name: DMG (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: packaging/macos/make_dmg.sh ${{ matrix.label }}
      - name: Setup EXE (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
        shell: pwsh
      - name: Calculate SHA-256 Checksums
        run: |
          python -c "
          import hashlib, glob, os
          from pathlib import Path
          dist = Path('dist')
          files = list(dist.glob('*.dmg')) + list(dist.glob('*Setup.exe'))
          lines = []
          for f in files:
              h = hashlib.sha256(f.read_bytes()).hexdigest()
              lines.append(f'{h}  {f.name}')
          Path('dist/SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          print('Generated checksums:')
          print('\n'.join(lines))
          "
      - uses: actions/upload-artifact@v7
        with:
          name: reforge-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*Setup.exe
            dist/SHA256SUMS.txt

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: out, merge-multiple: true }
      - name: Aggregate SHA256SUMS
        run: |
          find out -name "SHA256SUMS.txt" -exec cat {} + | sort -u > out/SHA256SUMS-all.txt
          mv out/SHA256SUMS-all.txt out/SHA256SUMS.txt
      - name: Extract Release Notes
        id: notes
        run: |
          python -c "
          import re
          from pathlib import Path
          tag = '${{ github.ref_name }}' or 'Latest'
          ver = tag.lstrip('v')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = r'## \[' + re.escape(ver) + r'\].*?(?=\n## \[|\Z)'
          match = re.search(pattern, changelog, re.DOTALL)
          if match:
              Path('release_notes.md').write_text(match.group(0).strip())
          else:
              Path('release_notes.md').write_text(f'Release {tag}')
          "
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: true
          files: |
            out/*.dmg
            out/*Setup.exe
            out/SHA256SUMS.txt
          body_path: release_notes.md
