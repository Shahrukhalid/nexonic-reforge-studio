name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.2)"
        required: false

permissions: { contents: write }

jobs:
  verify-gate:
    name: verify-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify Required CI Checks on Target Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python -c "
          import json, os, subprocess, sys

          token = os.environ.get('GH_TOKEN', '')
          sha = os.environ.get('COMMIT_SHA', '')
          repo = os.environ.get('REPO', 'Shahrukhalid/nexonic-reforge-studio')

          print(f'Checking CI status for commit {sha} in {repo}...')
          cmd = ['gh', 'api', f'repos/{repo}/commits/{sha}/check-runs', '--paginate']
          res = subprocess.run(cmd, capture_output=True, text=True, env=os.environ)
          runs = []
          if res.returncode == 0:
              try:
                  runs = json.loads(res.stdout).get('check_runs', [])
              except Exception:
                  pass

          statuses = {r['name']: (r.get('status'), r.get('conclusion')) for r in runs if 'name' in r}

          required = [
              'test (ubuntu-24.04)',
              'test (macos-15)',
              'test (macos-15-intel)',
              'test (windows-2022)',
              'audit',
              'integration',
              'integration-macos'
          ]

          # Fail closed: every required check must have status=completed and conclusion=success
          # on the exact target release commit.
          missing = [c for c in required if c not in statuses]
          if missing:
              print(f'::error::Release gate failed closed: missing required checks on commit {sha}: {missing}')
              sys.exit(1)

          failed_or_incomplete = []
          for req in required:
              status, conclusion = statuses[req]
              if status != 'completed' or conclusion != 'success':
                  failed_or_incomplete.append((req, status, conclusion))

          if failed_or_incomplete:
              print(f'::error::Release gate failed closed: non-success checks on commit {sha}: {failed_or_incomplete}')
              sys.exit(1)

          print(f'✓ All {len(required)} required CI checks passed with conclusion=success on commit {sha}:')
          for req in required:
              print(f'  - {req}: {statuses[req]}')
          "

  build:
    needs: verify-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: AppleSilicon }
          - { os: macos-15-intel, label: Intel }
          - { os: windows-2022, label: win }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: pytest -q --capture=sys
        env: { QT_QPA_PLATFORM: offscreen }
      - name: Run pytest (Unix)
        if: runner.os != 'Windows'
        run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - run: pyinstaller --noconfirm --distpath ../dist --workpath ../build reforge.spec
        working-directory: packaging
      - name: DMG (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: packaging/macos/make_dmg.sh ${{ matrix.label }}
      - name: Setup EXE (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
        shell: pwsh
      - name: Calculate SHA-256 Checksums
        run: |
          python -c "
          import hashlib, glob, os, sys
          from pathlib import Path
          dist = Path('dist')
          files = sorted(list(dist.glob('*.dmg')) + list(dist.glob('*Setup.exe')))
          if not files:
              sys.exit('Error: No installer or DMG found in dist/ directory!')
          lines = []
          for f in files:
              h = hashlib.sha256(f.read_bytes()).hexdigest()
              lines.append(f'{h}  {f.name}')
          out_file = Path('dist/SHA256SUMS-${{ matrix.label }}.txt')
          out_file.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Generated {out_file}:')
          print('\n'.join(lines))
          "
      - uses: actions/upload-artifact@v7
        with:
          name: reforge-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*Setup.exe
            dist/SHA256SUMS-*.txt

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: out, merge-multiple: true }
      - name: Aggregate and Verify SHA256SUMS
        run: |
          python -c "
          import hashlib, sys
          from pathlib import Path

          out = Path('out')
          part_files = sorted(out.glob('SHA256SUMS-*.txt'))
          if not part_files:
              sys.exit('Error: No partial SHA256SUMS-*.txt files found in out directory.')

          print(f'Found {len(part_files)} partial checksum files:')
          all_lines = []
          for pf in part_files:
              content = pf.read_text(encoding='utf-8').strip()
              print(f'--- {pf.name} ---')
              print(content)
              if content:
                  all_lines.extend(content.splitlines())

          # Sort and deduplicate
          unique_lines = sorted(list(set(all_lines)))
          master_file = out / 'SHA256SUMS.txt'
          master_file.write_text('\n'.join(unique_lines) + '\n', encoding='utf-8')

          print('\n=== Master SHA256SUMS.txt ===')
          print(master_file.read_text(encoding='utf-8'))

          # Verify that at least 3 installers exist in checksums
          installers = [line.split(maxsplit=1)[1].strip() for line in unique_lines if line.strip()]
          print(f'Parsed {len(installers)} installer entries from checksums: {installers}')

          expected_patterns = ['Windows_x64_Setup.exe', 'macOS_AppleSilicon.dmg', 'macOS_Intel.dmg']
          missing = []
          for pat in expected_patterns:
              if not any(pat in name for name in installers):
                  missing.append(pat)

          if missing:
              sys.exit(f'Error: Checksum manifest is missing required installer types: {missing}')

          # Verify every installer file exists on disk and its SHA-256 matches
          for line in unique_lines:
              if not line.strip():
                  continue
              parts = line.split(maxsplit=1)
              if len(parts) != 2:
                  continue
              expected_hash, filename = parts
              fpath = out / filename.strip()
              if not fpath.is_file():
                  sys.exit(f'Error: Referenced artifact {filename} does not exist in out/!')
              actual_hash = hashlib.sha256(fpath.read_bytes()).hexdigest()
              if actual_hash != expected_hash:
                  sys.exit(f'Error: Hash mismatch for {filename}! Expected {expected_hash}, got {actual_hash}')
              print(f'Verified integrity: {filename} ({fpath.stat().st_size:,} bytes) matches {expected_hash}')

          # Clean up partial checksum files so they are not uploaded as individual release assets
          for pf in part_files:
              pf.unlink()
          print('Cleaned up partial checksum files successfully.')
          "
      - name: Extract Release Notes
        id: notes
        run: |
          python -c "
          import re
          from pathlib import Path
          tag = '${{ github.ref_name }}' or 'Latest'
          ver = tag.lstrip('v')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = r'## \[' + re.escape(ver) + r'\].*?(?=\n## \[|\Z)'
          match = re.search(pattern, changelog, re.DOTALL)
          if match:
              Path('release_notes.md').write_text(match.group(0).strip())
          else:
              Path('release_notes.md').write_text(f'Release {tag}')
          "
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: true
          files: |
            out/*.dmg
            out/*Setup.exe
            out/SHA256SUMS.txt
          body_path: release_notes.md
