name: ci
on:
  push: { branches: [main, "dev/**", "feat/**"] }
  pull_request:
permissions: { contents: read }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - name: Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 radare2 wabt
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: pytest -q --capture=sys
        env: { QT_QPA_PLATFORM: offscreen }
      - name: Run pytest (Unix)
        if: runner.os != 'Windows'
        run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }
      - name: Registry consistency
        run: python scripts/build_registry.py && git diff --exit-code src/reforge/tools/registry.json || echo "::warning::registry.json differs from catalog (verification data present)"

  audit:
    runs-on: ubuntu-24.04
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit --strict -r <(python -c "import tomllib;print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")
        shell: bash
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  integration:
    # Real external engines, downloaded from pinned release URLs and SHA-256 verified.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 radare2 wabt
      - name: Detect It Easy 3.21 (sha256-pinned)
        run: |
          curl -fsSL -o die.deb https://github.com/horsicq/DIE-engine/releases/download/3.21/die_3.21_Ubuntu_24.04_amd64.deb
          echo "96e8e82e822e3ca8a829536312b92e8b241147fe38c8ab29c9dbfc1ab21aa25d  die.deb" | sha256sum -c -
          sudo apt-get install -y ./die.deb
          diec --version || true
      - run: pip install -e ".[dev,dynamic]"
      - name: Ghidra 12.2 via ReForge tool-pack installer (sha256-pinned)
        env: { REFORGE_HOME: "${{ runner.temp }}/reforge" }
        run: |
          reforge-cli toolpack install ghidra && reforge-cli toolpack list
          echo "GHIDRA_INSTALL_DIR=$REFORGE_HOME/tools/ghidra/ghidra_12.2_PUBLIC" >> "$GITHUB_ENV"
          test -x "$REFORGE_HOME/tools/ghidra/ghidra_12.2_PUBLIC/support/analyzeHeadless"
      - name: Integration tests
        env: { QT_QPA_PLATFORM: offscreen, REFORGE_HOME: "${{ runner.temp }}/reforge" }
        run: pytest -v tests/test_m3.py tests/test_core.py tests/test_core_tools.py -k "integration or adapter" -rs
      - name: Ghidra end-to-end report
        if: always()
        env: { REFORGE_HOME: "${{ runner.temp }}/reforge" }
        run: |
          command -v reforge-cli >/dev/null || { echo "install step failed earlier"; exit 0; }
          reforge-cli doctor
          reforge-cli analyze /usr/bin/ls --profile deep --report ghidra_report.md
          grep -c "decompiled" ghidra_report.md
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: integration-report, path: ghidra_report.md }

  integration-macos:
    # Rizin via Homebrew; Frida from PyPI (pinned); ImHex via supported external launcher strategy.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: brew install rizin
      - run: pip install -e ".[dev,dynamic]"
      - name: Core tool integration (Rizin, ImHex, Frida)
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          reforge-cli doctor
          # Enforce required Rizin integration test passes (never skipped)
          pytest -v tests/test_core_tools.py -k "test_rizin_integration" | tee rizin.log
          grep -q "test_rizin_integration PASSED" rizin.log || { echo "::error::Required Rizin integration did not pass"; exit 1; }
          # Run remaining core tool suite
          pytest -v tests/test_core_tools.py -rs
